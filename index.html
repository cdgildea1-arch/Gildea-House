<style>
  #weeklyView .weekly-title {
    align-items: flex-start;
  }

  #weeklyView .weekly-title > div {
    flex: 1;
    min-width: 0;
  }

  .weekly-exact-plus {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    margin-left: auto;
    border: 1px solid #dce2ef;
    border-radius: 12px;
    background: #edf1ff;
    color: #5578dc;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
  }

  .weekly-inline-add {
    margin: 14px 0;
    padding: 13px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    border: 1px solid #dfe5f0;
    border-radius: 13px;
    background: #f8faff;
  }

  .weekly-inline-add[hidden] {
    display: none;
  }

  .weekly-inline-add input {
    width: 100%;
    padding: 12px;
    border: 1px solid #dfe3eb;
    border-radius: 10px;
    font-size: 16px;
  }

  .weekly-inline-add button {
    padding: 0 15px;
    border: 0;
    border-radius: 10px;
    background: #172035;
    color: white;
    font-weight: 800;
  }

  .weekly-editable-text {
    min-width: 0;
    border-radius: 7px;
    cursor: text;
  }

  .weekly-editable-text:focus {
    margin: -5px -7px;
    padding: 5px 7px;
    outline: 2px solid #5578dc;
    background: white;
    color: #172035 !important;
    text-decoration: none !important;
    box-shadow: 0 0 0 4px #edf1ff;
  }

  .weekly-extra-list {
    display: grid;
  }

  .weekly-extra-row {
    min-height: 48px;
    padding: 9px 0;
    display: grid;
    grid-template-columns: 25px 1fr 32px;
    align-items: center;
    gap: 10px;
    border-top: 1px solid #eff1f5;
  }

  .weekly-extra-row input {
    width: 20px;
    height: 20px;
  }

  .weekly-extra-row span {
    font-size: 15px;
    line-height: 1.45;
  }

  .weekly-extra-row.done span {
    color: #a1a8b6;
    text-decoration: line-through;
  }

  .weekly-extra-delete {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 9px;
    background: #fff0ee;
    color: #b85b53;
    font-size: 20px;
  }
</style>

<script>
(() => {
  const STORAGE_KEY = "gildea-weekly-editable-v4";
  const sectionNumbers = ["1", "2", "3", "4", "5"];

  let saved = {
    edits: {},
    extras: { 1: [], 2: [], 3: [], 4: [], 5: [] }
  };

  try {
    const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    saved.edits = existing.edits || {};
    saved.extras = {
      1: existing.extras?.[1] || [],
      2: existing.extras?.[2] || [],
      3: existing.extras?.[3] || [],
      4: existing.extras?.[4] || [],
      5: existing.extras?.[5] || []
    };
  } catch {}

  const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  };

  const escapeHTML = value =>
    String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);

  function correctKristin(root) {
    const walker = document.createTreeWalker(
      root,
      NodeFilter.SHOW_TEXT
    );

    const textNodes = [];

    while (walker.nextNode()) {
      const node = walker.currentNode;
      const parent = node.parentElement;

      if (!parent || parent.closest("script, style")) continue;
      textNodes.push(node);
    }

    textNodes.forEach(node => {
      node.nodeValue = node.nodeValue
        .replace(/\bKRISTEN\b/g, "KRISTIN")
        .replace(/\bKristen\b/g, "Kristin");
    });

    root.querySelectorAll("[placeholder], [aria-label], [title]").forEach(element => {
      ["placeholder", "aria-label", "title"].forEach(attribute => {
        if (!element.hasAttribute(attribute)) return;

        element.setAttribute(
          attribute,
          element.getAttribute(attribute)
            .replace(/\bKRISTEN\b/g, "KRISTIN")
            .replace(/\bKristen\b/g, "Kristin")
        );
      });
    });
  }

  function focusAtEnd(element) {
    element.focus();

    const range = document.createRange();
    range.selectNodeContents(element);
    range.collapse(false);

    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }

  function makeStaticItemEditable(textElement, key) {
    if (!textElement.dataset.originalWeeklyText) {
      textElement.dataset.originalWeeklyText = textElement.textContent.trim();
    }

    if (
      document.activeElement !== textElement &&
      Object.prototype.hasOwnProperty.call(saved.edits, key)
    ) {
      textElement.textContent = saved.edits[key];
    }

    textElement.contentEditable = "true";
    textElement.tabIndex = 0;
    textElement.classList.add("weekly-editable-text");
    textElement.setAttribute("role", "textbox");
    textElement.setAttribute("aria-label", "Edit checklist item");

    if (textElement.dataset.weeklyEditBound) return;
    textElement.dataset.weeklyEditBound = "true";

    textElement.onclick = event => {
      event.preventDefault();
      event.stopPropagation();
      focusAtEnd(textElement);
    };

    textElement.onkeydown = event => {
      if (event.key === "Enter") {
        event.preventDefault();
        textElement.blur();
      }
    };

    textElement.onblur = () => {
      const updatedText = textElement.textContent
        .replace(/\s+/g, " ")
        .trim();

      if (updatedText) {
        saved.edits[key] = updatedText;
      } else {
        delete saved.edits[key];
        textElement.textContent = textElement.dataset.originalWeeklyText;
      }

      save();
    };
  }

  function renderExtraItems(section, sectionNumber) {
    const list = section.querySelector(".weekly-extra-list");
    if (!list) return;

    const items = saved.extras[sectionNumber] || [];
    const fingerprint = JSON.stringify(items);

    if (list.dataset.fingerprint === fingerprint) return;
    list.dataset.fingerprint = fingerprint;

    list.innerHTML = items.map(item => `
      <div class="weekly-extra-row ${item.done ? "done" : ""}">
        <input
          type="checkbox"
          data-extra-check="${item.id}"
          ${item.done ? "checked" : ""}
          aria-label="Complete item"
        >

        <span
          class="weekly-editable-text"
          contenteditable="true"
          data-extra-edit="${item.id}"
          role="textbox"
        >${escapeHTML(item.text)}</span>

        <button
          class="weekly-extra-delete"
          type="button"
          data-extra-delete="${item.id}"
          aria-label="Delete item"
        >×</button>
      </div>
    `).join("");

    list.querySelectorAll("[data-extra-check]").forEach(checkbox => {
      checkbox.onchange = () => {
        const item = items.find(
          entry => String(entry.id) === checkbox.dataset.extraCheck
        );

        if (item) {
          item.done = checkbox.checked;
          save();
          list.dataset.fingerprint = "";
          renderExtraItems(section, sectionNumber);
        }
      };
    });

    list.querySelectorAll("[data-extra-edit]").forEach(textElement => {
      textElement.onclick = event => {
        event.stopPropagation();
        focusAtEnd(textElement);
      };

      textElement.onkeydown = event => {
        if (event.key === "Enter") {
          event.preventDefault();
          textElement.blur();
        }
      };

      textElement.onblur = () => {
        const item = items.find(
          entry => String(entry.id) === textElement.dataset.extraEdit
        );

        const updatedText = textElement.textContent
          .replace(/\s+/g, " ")
          .trim();

        if (item && updatedText) {
          item.text = updatedText;
          save();
        } else if (item) {
          textElement.textContent = item.text;
        }
      };
    });

    list.querySelectorAll("[data-extra-delete]").forEach(button => {
      button.onclick = () => {
        saved.extras[sectionNumber] = items.filter(
          item => String(item.id) !== button.dataset.extraDelete
        );

        save();
        list.dataset.fingerprint = "";
        renderExtraItems(section, sectionNumber);
      };
    });
  }

  function setupSection(section, sectionNumber) {
    const title = section.querySelector(".weekly-title");
    if (!title) return;

    section.dataset.exactWeeklySection = sectionNumber;

    let plusButton = title.querySelector(".weekly-exact-plus");

    if (!plusButton) {
      plusButton = document.createElement("button");
      plusButton.type = "button";
      plusButton.className = "weekly-exact-plus";
      plusButton.textContent = "+";
      plusButton.setAttribute(
        "aria-label",
        `Add an item to section ${sectionNumber}`
      );

      title.appendChild(plusButton);
    }

    let addForm = Array.from(section.children).find(
      child => child.classList?.contains("weekly-inline-add")
    );

    let extraList = Array.from(section.children).find(
      child => child.classList?.contains("weekly-extra-list")
    );

    if (!addForm) {
      addForm = document.createElement("form");
      addForm.className = "weekly-inline-add";
      addForm.hidden = true;
      addForm.innerHTML = `
        <input
          maxlength="120"
          placeholder="Type the new item here…"
          aria-label="New checklist item"
          required
        >
        <button type="submit">Add</button>
      `;
    }

    if (!extraList) {
      extraList = document.createElement("div");
      extraList.className = "weekly-extra-list";
    }

    title.after(addForm, extraList);

    plusButton.onclick = () => {
      addForm.hidden = !addForm.hidden;
      plusButton.textContent = addForm.hidden ? "+" : "−";

      if (!addForm.hidden) {
        setTimeout(() => addForm.querySelector("input").focus(), 0);
      }
    };

    addForm.onsubmit = event => {
      event.preventDefault();

      const input = addForm.querySelector("input");
      const text = input.value.trim();

      if (!text) return;

      saved.extras[sectionNumber].push({
        id: Date.now() + Math.floor(Math.random() * 1000),
        text,
        done: false
      });

      input.value = "";
      save();

      extraList.dataset.fingerprint = "";
      renderExtraItems(section, sectionNumber);
    };

    section.querySelectorAll(".weekly-item").forEach((row, index) => {
      if (row.closest(".weekly-extra-list")) return;

      const checkbox = row.querySelector("[data-weekly-check]");
      const spans = row.querySelectorAll("span");
      const textElement = spans[spans.length - 1];

      if (!textElement) return;

      const key =
        checkbox?.dataset.weeklyCheck ||
        `section-${sectionNumber}-item-${index}`;

      makeStaticItemEditable(textElement, key);
    });

    renderExtraItems(section, sectionNumber);
  }

  function initializeWeeklyEditor() {
    const weeklyView = document.getElementById("weeklyView");
    if (!weeklyView) return;

    correctKristin(weeklyView);

    weeklyView.querySelectorAll(".weekly-section").forEach(section => {
      const number = section
        .querySelector(".weekly-number")
        ?.textContent
        .trim();

      if (sectionNumbers.includes(number)) {
        setupSection(section, number);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeWeeklyEditor);
  } else {
    initializeWeeklyEditor();
  }

  setTimeout(initializeWeeklyEditor, 800);
})();
</script>
