<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>Checklist · Gildea Home</title>
<style>
:root{
  --ink:#172035;--muted:#778195;--line:#e7eaf0;--paper:#fff;--wash:#f5f7fb;
  --blue:#5578dc;--blueSoft:#eef2ff;--pink:#fff0f4;--gold:#fff6e4;
  --green:#579577;--greenSoft:#eaf7f0;--shadow:0 12px 36px rgba(34,45,70,.08)
}
*{box-sizing:border-box}
html{background:var(--wash)}
body{
  margin:0;color:var(--ink);background:var(--wash);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent
}
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(10px + env(safe-area-inset-top)) 15px 10px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)
}
.toprow{max-width:680px;margin:auto;display:flex;align-items:center;gap:12px}
.back{
  width:40px;height:40px;border:0;border-radius:13px;background:var(--ink);color:#fff;
  display:grid;place-items:center;text-decoration:none;font-size:22px;font-weight:700
}
.title{min-width:0;flex:1}
.title small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.title h1{margin:3px 0 0;font:600 24px Georgia,serif}
.reset{
  border:1px solid var(--line);background:#fff;color:var(--blue);
  border-radius:11px;padding:10px 12px;font-size:11px;font-weight:800
}
main{max-width:680px;margin:auto;padding:18px 14px 108px}
.hero{
  padding:20px;border-radius:22px;background:linear-gradient(135deg,#eef2ff,#f9efff);
  border:1px solid #e4e7f5;box-shadow:var(--shadow);margin-bottom:14px
}
.hero .eyebrow{margin:0;color:#7d86a0;font-size:9px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}
.hero h2{margin:6px 0 7px;font:600 26px Georgia,serif}
.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.progressrow{margin-top:16px;display:flex;align-items:center;gap:10px}
.track{height:9px;border-radius:99px;background:rgba(255,255,255,.8);overflow:hidden;flex:1}
.fill{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .2s ease}
.progressText{font-size:11px;font-weight:800;color:var(--blue);min-width:48px;text-align:right}
.group{
  margin:12px 0;border:1px solid var(--line);border-radius:20px;background:#fff;
  box-shadow:0 8px 26px rgba(34,45,70,.05);overflow:hidden
}
.grouphead{padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
.grouphead i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:18px}
.group:nth-of-type(2) .grouphead i{background:var(--pink)}
.group:nth-of-type(3) .grouphead i{background:#e9f3ff}
.group:nth-of-type(4) .grouphead i{background:var(--gold)}
.group:nth-of-type(5) .grouphead i{background:var(--greenSoft)}
.group:nth-of-type(6) .grouphead i{background:#f1ecff}
.group:nth-of-type(7) .grouphead i{background:#eaf7f0}
.group:nth-of-type(8) .grouphead i{background:#fff0e8}
.group:nth-of-type(9) .grouphead i{background:#eef0f4}
.grouphead h3{margin:0;font:600 18px Georgia,serif}
.item{
  position:relative;min-height:58px;padding:13px 15px;
  display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;
  border-top:1px solid #eff1f5;cursor:pointer
}
.item input{position:absolute;opacity:0;pointer-events:none}
.box{
  width:27px;height:27px;border:1.5px solid #cbd2df;border-radius:9px;
  background:#fff;display:grid;place-items:center;color:transparent;
  font-size:15px;font-weight:900;transition:.15s ease
}
.item span:last-child{font-size:14px;line-height:1.35}
.item.checked .box{background:var(--green);border-color:var(--green);color:#fff}
.item.checked span:last-child{color:#9aa2b0;text-decoration:line-through}
.footer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(15px)
}
.footerin{max-width:680px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.footer a,.footer button{
  min-height:47px;border-radius:14px;font-size:12px;font-weight:850;text-decoration:none;
  display:grid;place-items:center
}
.footer a{background:var(--ink);color:#fff}
.footer button{border:1px solid var(--line);background:#fff;color:var(--blue)}
@media(min-width:700px){main{padding-top:26px}.hero{padding:26px}}
</style>
</head>
<body>
<header class="top">
  <div class="toprow">
    <a class="back" href="index.html" aria-label="Back to Gildea Home">‹</a>
    <div class="title"><small>Gildea Home</small><h1>Checklist</h1></div>
    <button class="reset" id="resetTop" type="button">Reset</button>
  </div>
</header>

<main>
  <section class="hero">
    <p class="eyebrow">Merritt</p>
    <h2>Diaper bag</h2>
    <p>Tap an item as it goes in the bag. Your checks stay saved on this phone until you reset them.</p>
    <div class="progressrow"><div class="track"><div class="fill" id="fill"></div></div><div class="progressText" id="progressText">0%</div></div>
  </section>

  <section class="group"><div class="grouphead"><i>🍼</i><h3>Diaper duty</h3></div>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>6–8 diapers</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Travel wipes</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Diaper rash cream</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Portable changing pad</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Disposable diaper bags / small trash bags</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Hand sanitizer</span></label>
  </section>

  <section class="group"><div class="grouphead"><i>👕</i><h3>Clothes</h3></div>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>2 complete changes of clothes</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Extra onesie</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Extra socks</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Bib</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Burp cloths</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Light blanket</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Weather-appropriate hat</span></label>
  </section>

  <section class="group"><div class="grouphead"><i>🥛</i><h3>Feeding</h3></div>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Bottles</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Breast milk / formula as needed</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Insulated bottle bag + ice pack if needed</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Extra bottle nipple</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Water for parent</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Nursing cover, if wanted</span></label>
  </section>

  <section class="group"><div class="grouphead"><i>💚</i><h3>Comfort</h3></div>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Pacifier</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Backup pacifier</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Pacifier clip</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Swaddle / receiving blanket</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Small baby-safe comfort item</span></label>
  </section>

  <section class="group"><div class="grouphead"><i>🧼</i><h3>Messes & cleanup</h3></div>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Wet bag for dirty clothes</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Tissues</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Baby-safe sanitizing wipes</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Extra zip-top bags</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Extra shirt for Mom/Dad</span></label>
  </section>

  <section class="group"><div class="grouphead"><i>☀️</i><h3>Going out</h3></div>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Stroller fan if needed</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Car-seat / stroller cover as appropriate</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Sun hat</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Baby carrier</span></label>
  </section>

  <section class="group"><div class="grouphead"><i>🩹</i><h3>Just in case</h3></div>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Emergency contact information</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Pediatrician information</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Insurance card / info</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Any baby medications specifically needed</span></label>
  </section>

  <section class="group"><div class="grouphead"><i>👨‍👩‍👧</i><h3>Parent stuff</h3></div>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Phone</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Wallet</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Keys</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Portable charger</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Water</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Snack</span></label>
    <label class="item"><input type="checkbox"><span class="box">✓</span><span>Mom’s postpartum / personal supplies as needed</span></label>
  </section>
</main>

<footer class="footer"><div class="footerin">
  <a href="index.html">⌂ Gildea Home</a>
  <button type="button" id="resetBottom">Clear all checks</button>
</div></footer>

<script>
(() => {
  const key='gildea-diaper-bag-checklist-v2';
  const boxes=[...document.querySelectorAll('.item input')];
  const items=[...document.querySelectorAll('.item')];
  let state=[];
  try{state=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){state=[]}

  function paint(){
    let checked=0;
    boxes.forEach((box,i)=>{
      box.checked=!!state[i];
      items[i].classList.toggle('checked',box.checked);
      if(box.checked) checked++;
    });
    const pct=boxes.length?Math.round(checked/boxes.length*100):0;
    document.getElementById('fill').style.width=pct+'%';
    document.getElementById('progressText').textContent=checked+'/'+boxes.length;
  }

  boxes.forEach((box,i)=>box.addEventListener('change',()=>{
    state[i]=box.checked;
    localStorage.setItem(key,JSON.stringify(state));
    paint();
  }));

  function reset(){
    if(!confirm('Clear every check and start fresh?')) return;
    state=[];
    localStorage.removeItem(key);
    paint();
  }
  document.getElementById('resetTop').onclick=reset;
  document.getElementById('resetBottom').onclick=reset;
  paint();
})();
</script>
</body>
</html>
